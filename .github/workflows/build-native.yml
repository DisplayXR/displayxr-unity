name: Build Native Plugin

on:
  # Public-repo CI policy: fire freely. CI is free for public repos
  # on GitHub-hosted runners, so we optimize for contributor experience
  # rather than minute-burn:
  # - All PRs run CI (drafts included). Fast feedback without the
  #   ready-for-review handshake. No path filter — small repo, native
  #   build is ~45s, not worth the gating complexity.
  # - Push to main fires the workflow as a sanity check (catches the
  #   rare admin-bypass merge that lands red).
  # - Tag pushes (v*) fire the build + release jobs.
  # - Rapid pushes to a PR cancel the in-progress run (concurrency
  #   group below) so only the latest commit's CI completes.
  push:
    branches: [main]
    tags:
      - 'v*'
  pull_request: {}
  workflow_dispatch:

# Cancel any in-progress run for the same PR (or branch) when a new
# push comes in.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  # Short-circuit doc-only / empty pushes so the required checks
  # (Windows x64, macOS (Universal)) report success in seconds without a
  # native compile. An EMPTY diff also counts as docs_only: the only
  # zero-file pushes to main are /dxr-release's empty "Release vX.Y.Z"
  # marker commits — their real build runs on the v* tag push (forced
  # docs_only=false below). Mirrors displayxr-runtime's build-windows.yml.
  DetectChanges:
    runs-on: ubuntu-latest
    outputs:
      docs_only: ${{ steps.filter.outputs.docs_only }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - id: filter
        run: |
          # Tag pushes are releases — always build.
          if [ "${{ github.ref_type }}" = "tag" ]; then
            echo "docs_only=false" >> "$GITHUB_OUTPUT"
            echo "Tag push — forcing docs_only=false"
            exit 0
          fi
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            BASE=${{ github.event.pull_request.base.sha }}
          else
            BASE=${{ github.event.before }}
          fi
          CHANGED=$(git diff --name-only "$BASE" HEAD)
          # Every changed file matches a doc/boilerplate pattern → docs_only.
          # Empty diff (marker commit) → docs_only too. Runs under bash -e,
          # so a bad BASE object fails the job rather than faking empty.
          NON_DOC=$(echo "$CHANGED" | grep -vE '^(docs/|.*\.md$|LICENSE$|\.github/ISSUE_TEMPLATE/)' || true)
          if [ -z "$NON_DOC" ]; then
            echo "docs_only=true" >> "$GITHUB_OUTPUT"
          else
            echo "docs_only=false" >> "$GITHUB_OUTPUT"
          fi
          echo "docs_only=$(grep ^docs_only= "$GITHUB_OUTPUT" | cut -d= -f2)"

  build-windows:
    name: Windows x64
    needs: DetectChanges
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - name: Configure CMake
        if: needs.DetectChanges.outputs.docs_only != 'true'
        run: cmake -S native~ -B native~/build -A x64 -DCMAKE_BUILD_TYPE=Release

      - name: Build
        if: needs.DetectChanges.outputs.docs_only != 'true'
        run: cmake --build native~/build --config Release

      - name: Verify output
        if: needs.DetectChanges.outputs.docs_only != 'true'
        run: |
          if (!(Test-Path "Runtime/Plugins/Windows/x64/displayxr_unity.dll")) {
            Write-Error "DLL not found at expected path"
            exit 1
          }
          Write-Host "Built successfully: Runtime/Plugins/Windows/x64/displayxr_unity.dll"
          Get-Item "Runtime/Plugins/Windows/x64/displayxr_unity.dll" | Select-Object Name, Length

      - name: Upload artifact
        if: needs.DetectChanges.outputs.docs_only != 'true'
        uses: actions/upload-artifact@v6
        with:
          name: displayxr_unity-windows-x64
          path: Runtime/Plugins/Windows/x64/displayxr_unity.dll

  build-macos:
    name: macOS (Universal)
    needs: DetectChanges
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5

      - name: Configure CMake
        if: needs.DetectChanges.outputs.docs_only != 'true'
        run: cmake -S native~ -B native~/build -DCMAKE_BUILD_TYPE=Release -DCMAKE_OSX_ARCHITECTURES="x86_64;arm64"

      - name: Build
        if: needs.DetectChanges.outputs.docs_only != 'true'
        run: cmake --build native~/build --config Release

      - name: Verify output
        if: needs.DetectChanges.outputs.docs_only != 'true'
        run: |
          BUNDLE="Runtime/Plugins/macOS/displayxr_unity.bundle"
          if [ ! -d "$BUNDLE" ]; then
            echo "ERROR: Bundle not found at $BUNDLE"
            exit 1
          fi
          echo "Built successfully: $BUNDLE"
          ls -la "$BUNDLE"
          file "$BUNDLE/displayxr_unity" 2>/dev/null || file "$BUNDLE/Contents/MacOS/displayxr_unity" 2>/dev/null || echo "Binary location varies by CMake version"

      - name: Upload artifact
        if: needs.DetectChanges.outputs.docs_only != 'true'
        uses: actions/upload-artifact@v6
        with:
          name: displayxr_unity-macos
          path: Runtime/Plugins/macOS/displayxr_unity.bundle

  build-linux:
    name: Linux x86_64
    needs: DetectChanges
    runs-on: ubuntu-latest
    # Build INSIDE ubuntu:22.04 rather than on the runner image, so the .so links
    # against the oldest glibc we intend to support — a plugin built on a newer
    # runner silently refuses to load on an older distro, and Unity reports that
    # as "subsystem not found" rather than as a link error (#249). Same reasoning
    # as the runtime repo's tri-LTS matrix.
    container: ubuntu:22.04
    steps:
      - name: Install toolchain
        if: needs.DetectChanges.outputs.docs_only != 'true'
        run: |
          export DEBIAN_FRONTEND=noninteractive
          apt-get update -qq
          apt-get install -y --no-install-recommends \
            build-essential cmake git ca-certificates binutils file
          # actions/checkout needs a git new enough for its safe.directory handling
          git --version

      - uses: actions/checkout@v5

      - name: Configure CMake
        if: needs.DetectChanges.outputs.docs_only != 'true'
        run: cmake -S native~ -B native~/build -DCMAKE_BUILD_TYPE=Release

      - name: Build
        if: needs.DetectChanges.outputs.docs_only != 'true'
        run: cmake --build native~/build --config Release -j"$(nproc)"

      - name: Verify output
        if: needs.DetectChanges.outputs.docs_only != 'true'
        run: |
          SO="Runtime/Plugins/Linux/x86_64/libdisplayxr_unity.so"
          if [ ! -f "$SO" ]; then
            echo "ERROR: .so not found at $SO"
            exit 1
          fi
          file "$SO"
          ls -la "$SO"

          # The build uses -fvisibility=hidden, so this is a REAL gate: a translation
          # unit dropped by a mis-set platform guard shows up here and nowhere else.
          # XRSDKPreInit in particular is what Unity's boot.config pre-init hook calls,
          # and it is the Linux-specific piece #249 exists to exercise.
          for sym in UnityPluginLoad UnityPluginUnload XRSDKPreInit; do
            if ! nm -D --defined-only "$SO" | grep -q " T $sym$"; then
              echo "ERROR: required export missing: $sym"
              nm -D --defined-only "$SO" | head -40
              exit 1
            fi
            echo "export OK: $sym"
          done

          # The plugin must resolve Vulkan and Xlib through dlopen
          # (displayxr_vk_loader / displayxr_linux.c), never by linking them —
          # otherwise it fails to load on a box with no Vulkan ICD or no X11.
          for lib in libvulkan libX11; do
            if readelf -d "$SO" | grep -q "$lib"; then
              echo "ERROR: .so has a hard dependency on $lib — it must dlopen it instead"
              readelf -d "$SO" | grep NEEDED
              exit 1
            fi
            echo "no $lib link dependency: OK"
          done

          # NO UNRESOLVED SYMBOLS. This is the check that was missing when #249
          # first landed: unlike MSVC and macOS's two-level namespace, a Linux
          # shared library links happily with dangling references and only fails
          # when the loader binds them — so CI was green on a .so that died at
          # `undefined symbol: displayxr_is_shell_mode` inside GfxStart on the
          # target box. The link now also passes -Wl,--no-undefined (see
          # CMakeLists.txt), which makes this belt-and-braces; keep both, because
          # the link flag is easy to drop by accident and this is the symptom
          # a user would actually hit.
          if ldd -r "$SO" 2>&1 | grep -q 'undefined symbol'; then
            echo "ERROR: unresolved symbols in the shipped .so — it will fail to load:"
            ldd -r "$SO" 2>&1 | grep 'undefined symbol' | sort -u
            exit 1
          fi
          echo "no unresolved symbols: OK"

      - name: Upload artifact
        if: needs.DetectChanges.outputs.docs_only != 'true'
        uses: actions/upload-artifact@v6
        with:
          name: displayxr_unity-linux-x86_64
          path: Runtime/Plugins/Linux/x86_64/libdisplayxr_unity.so

  # ── Release job: runs on v* tags ──────────────────────────────────────
  release:
    name: Create GitHub Release
    needs: [build-windows, build-macos, build-linux]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5

      - name: Download Windows artifact
        uses: actions/download-artifact@v7
        with:
          name: displayxr_unity-windows-x64
          path: Runtime/Plugins/Windows/x64/

      - name: Download macOS artifact
        uses: actions/download-artifact@v7
        with:
          name: displayxr_unity-macos
          path: Runtime/Plugins/macOS/

      # Linux (#249). The .so is NOT committed to the repo — unlike the Windows DLL
      # and macOS bundle, no maintainer box builds it locally — so the artifact is
      # the only source. Its .meta IS committed, so Unity imports the pair correctly
      # once this lands.
      - name: Download Linux artifact
        uses: actions/download-artifact@v7
        with:
          name: displayxr_unity-linux-x86_64
          path: Runtime/Plugins/Linux/x86_64/

      - name: Get version from tag
        id: version
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Verify package.json version matches tag
        run: |
          PKG_VERSION=$(jq -r .version package.json)
          TAG_VERSION="${{ steps.version.outputs.version }}"
          if [ "$PKG_VERSION" != "$TAG_VERSION" ]; then
            echo "WARNING: package.json version ($PKG_VERSION) != tag version ($TAG_VERSION)"
            echo "Updating package.json to match tag..."
            jq --arg v "$TAG_VERSION" '.version = $v' package.json > package.json.tmp
            mv package.json.tmp package.json
          fi

      - name: Create UPM tarball
        run: |
          # Build the package directory with binaries included
          PKG_DIR="com.displayxr.unity-${{ steps.version.outputs.version }}"
          mkdir "$PKG_DIR"
          # Copy package contents (everything Unity needs)
          cp -r Runtime/ "$PKG_DIR/Runtime/"
          cp Runtime.meta "$PKG_DIR/Runtime.meta"
          cp -r Editor/ "$PKG_DIR/Editor/"
          cp Editor.meta "$PKG_DIR/Editor.meta"
          cp -r Samples~/ "$PKG_DIR/Samples~/" 2>/dev/null || true
          cp package.json "$PKG_DIR/"
          cp README.md "$PKG_DIR/"
          cp CHANGELOG.md "$PKG_DIR/"
          cp LICENSE "$PKG_DIR/"
          # Create tarball (npm pack format that UPM understands)
          tar czf "com.displayxr.unity-${{ steps.version.outputs.version }}.tgz" "$PKG_DIR"
          echo "Created: com.displayxr.unity-${{ steps.version.outputs.version }}.tgz"
          ls -lh *.tgz

      - name: Push upm branch with binaries
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # Create branch from the tag contents + binaries
          git checkout -B upm

          # Patch package.json to the tag version on the upm branch. The
          # earlier "Verify package.json version matches tag" step only edits
          # the working tree and never stages it, so without this the commit
          # below would carry HEAD's (possibly stale) version — the .tgz would
          # be correct but the #upm branch would ship the old version string.
          # jq-patch here and stage it so the committed package.json matches
          # the tag.
          TAG_VERSION="${{ steps.version.outputs.version }}"
          jq --arg v "$TAG_VERSION" '.version = $v' package.json > package.json.tmp
          mv package.json.tmp package.json
          git add package.json

          # Strip dev-only files that don't belong in a published Unity
          # package. Unity Package Manager strips *.md.meta files at the
          # package root, then warns about every .md file there that isn't
          # one of its recognized docs (README/CHANGELOG/LICENSE) — so any
          # extra .md (CLAUDE, CONTRIBUTING, etc.) creates per-install
          # warnings ("Asset has no meta file, in immutable folder"). Plus
          # there's no reason to ship dev tooling to consumers.
          git rm -rf --cached --ignore-unmatch \
              .claude .github .gitattributes .gitignore \
              CLAUDE.md CLAUDE.md.meta \
              CONTRIBUTING.md CONTRIBUTING.md.meta \
              launch-app.sh launch-app.sh.meta \
              launch-unity.sh launch-unity.sh.meta \
              || true
          rm -rf .claude .github .gitattributes .gitignore \
                 CLAUDE.md CLAUDE.md.meta \
                 CONTRIBUTING.md CONTRIBUTING.md.meta \
                 launch-app.sh launch-app.sh.meta \
                 launch-unity.sh launch-unity.sh.meta

          # Force-add the binaries (normally gitignored or absent).
          git add -f Runtime/Plugins/Windows/x64/displayxr_unity.dll
          git add -f Runtime/Plugins/macOS/displayxr_unity.bundle

          # NOTE: deliberately NOT using `git add -A` here. The previous
          # job step ("Create UPM tarball") leaves an untracked staging
          # directory `com.displayxr.unity-X.Y.Z/` and the resulting
          # `.tgz` file in the working tree. `git add -A` would sweep both
          # into the upm branch — the directory then ships as a duplicate
          # nested copy of the package and Unity reports hundreds of
          # "Asset has no meta file, in immutable folder" errors on
          # install. The `git rm --cached` calls above already staged the
          # required removals; keeping `git add` selective avoids the
          # nested-package bug. We MUST also leave the .tgz alone in the
          # working tree because the next workflow step uploads it to the
          # GitHub Release.
          git commit -m "Release ${{ github.ref_name }}: add native binaries for UPM git install"
          git push -f origin upm
          # Also tag the upm branch for version-pinned installs
          git tag -f "upm/${{ github.ref_name }}"
          git push -f origin "upm/${{ github.ref_name }}"

      - name: Extract changelog for this version
        id: changelog
        run: |
          # Extract the section for this version from CHANGELOG.md
          VERSION="${{ steps.version.outputs.version }}"
          # Get content between this version header and the next version header
          NOTES=$(sed -n "/^## \[$VERSION\]/,/^## \[/p" CHANGELOG.md | sed '$d')
          if [ -z "$NOTES" ]; then
            NOTES="Release $VERSION"
          fi
          # Write to file for gh release
          echo "$NOTES" > release_notes.md
          cat release_notes.md

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ github.ref_name }}" \
            --title "DisplayXR ${{ github.ref_name }}" \
            --notes-file release_notes.md \
            "com.displayxr.unity-${{ steps.version.outputs.version }}.tgz#UPM Package (.tgz)"

  # ── Package job: runs on main push (non-tag) ─────────────────────────
  package:
    name: Package Plugin Binaries
    needs: [DetectChanges, build-windows, build-macos, build-linux]
    runs-on: ubuntu-latest
    # Skip on docs-only / empty (marker) main pushes — the build jobs
    # short-circuit and upload no artifacts, so there's nothing to package.
    if: github.ref == 'refs/heads/main' && github.event_name == 'push' && needs.DetectChanges.outputs.docs_only != 'true'
    steps:
      - uses: actions/checkout@v5

      - name: Download Windows artifact
        uses: actions/download-artifact@v7
        with:
          name: displayxr_unity-windows-x64
          path: Runtime/Plugins/Windows/x64/

      - name: Download macOS artifact
        uses: actions/download-artifact@v7
        with:
          name: displayxr_unity-macos
          path: Runtime/Plugins/macOS/

      - name: Download Linux artifact
        uses: actions/download-artifact@v7
        with:
          name: displayxr_unity-linux-x86_64
          path: Runtime/Plugins/Linux/x86_64/

      - name: Upload combined artifact
        uses: actions/upload-artifact@v6
        with:
          name: displayxr-unity-plugin
          path: |
            Runtime/
            Runtime.meta
            Editor/
            Editor.meta
            Samples~/
            package.json
            README.md
            CHANGELOG.md
            LICENSE
